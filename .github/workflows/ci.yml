name: CI

on:
  push:
    # praktikum/start and the lab's solution branches (apps/rnlab) get CI on
    # push too, not only through a PR.
    branches: [main, praktikum/start, 'loesung/**']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs: a push while a build is in flight makes that build
# irrelevant, and the firmware build is the slow part.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Firmware (STM32F429${{ matrix.name == 'minimal' && ', minimal apps' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            cmake_extra_args: ""
          # A second configuration, every optional app (docs/ROADMAP.md M6's
          # own "build-time optional apps" bullet) turned OFF. Exists because
          # that task's own first version silently left two link lines
          # unconditional - masked by CMake's own lazy handling of an
          # unmatched library name, which let an unrelated compile failure
          # surface before the real bug ever did - and the only thing that
          # caught it was actually building this exact configuration, not
          # reading the CMake. A CI job that only ever builds the default
          # (everything ON) config would happily go green again the next
          # time someone adds a new optional-app reach without gating it.
          - name: minimal
            cmake_extra_args: >-
              -DCADS_APP_SETTINGS=OFF -DCADS_APP_ABOUT=OFF -DCADS_APP_GPIO=OFF
              -DCADS_APP_NETINFO=OFF -DCADS_APP_FILEBROWSER=OFF -DCADS_APP_GAME=OFF
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.3.Rel1'

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi-gcc.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCADS_ARM_TOOLCHAIN_BIN=$(dirname $(which arm-none-eabi-gcc)) \
            ${{ matrix.cmake_extra_args }}

      - name: Build
        run: cmake --build build

      # The size report is a regression signal, not decoration. FLASH_FS must
      # stay at zero: anything landing there would collide with the littlefs
      # volume in flash bank 2.
      - name: Size report
        run: |
          arm-none-eabi-size build/cads-zero.elf
          echo '### Size' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          arm-none-eabi-size build/cads-zero.elf >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # The linker script's own ASSERT(__cads_heap_size >= 48K, ...) is a
      # floor, not a budget - this milestone's own history hit that floor
      # exactly (0 B of margin) more than once, caught only by a human
      # counting bytes by hand afterward. This fails the build early
      # instead, at a real margin, not just before the link outright
      # refuses. See scripts/check_ram_budget.py's own file header.
      - name: RAM regression budget
        run: |
          set -o pipefail
          python3 scripts/check_ram_budget.py build/cads-zero.elf | tee -a $GITHUB_STEP_SUMMARY

      # The size report above is printed, not gated - nothing failed a build
      # for using more of FLASH_APP than intended before this. See
      # scripts/check_flash_budget.py's own file header for why 512 K.
      - name: Flash regression budget
        run: |
          set -o pipefail
          python3 scripts/check_flash_budget.py build/cads-zero.elf | tee -a $GITHUB_STEP_SUMMARY

      # See scripts/check_fs_window.py's own file header: this used to be a
      # grep against objdump's raw text, unanchored to the address column,
      # which produced a real false positive once a build's memory layout
      # shifted a coincidental hex substring into view.
      - name: Check the filesystem region is untouched
        run: python3 scripts/check_fs_window.py build/cads-zero.elf

      - uses: actions/upload-artifact@v4
        with:
          # Matrix-unique name: actions/upload-artifact@v4 refuses two
          # uploads of the same name within one workflow run, and the
          # matrix above now runs this job twice.
          name: firmware-${{ matrix.name }}
          path: |
            build/cads-zero.elf
            build/cads-zero.bin
            build/cads-zero.map

  # The student/course path: scripts/build.sh itself, on a machine with no
  # Keil Studio vcpkg tree (~/.vcpkg) - the toolchain only on PATH, as in the
  # firmware-lab image, on Linux and on Windows. scripts/cads_env.sh used to
  # abort there under `set -euo pipefail` before ever reaching the compiler.
  build-script:
    name: scripts/build.sh without vcpkg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.3.Rel1'

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: No vcpkg tree present
        run: test ! -e "$HOME/.vcpkg"

      - name: scripts/build.sh
        run: bash scripts/build.sh Release

  # Every build variant the lab sheets name (apps/rnlab/lab_variants.txt:
  # TCP window, MSS, RX ring depth). They sit close to the end of the SRAM
  # and no other job builds them - L08's mandatory variant stopped linking
  # unnoticed that way.
  lab-variants:
    name: Lab build variants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.3.Rel1'

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build all lab variants
        run: |
          set -o pipefail
          {
            echo '### Lab build variants'
            echo '```'
            bash scripts/build_lab_variants.sh
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload logs of failed variants
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lab-variant-logs
          path: build/lab-variants/failed-*.log
          if-no-files-found: ignore

  host:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libsdl2-dev

      - name: Configure
        run: cmake -S . -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build/host

      # apps/rnlab lesson tests carry the label rnlab-LNN. On praktikum/start
      # (and anything that is not a solution branch) they may be expected red
      # once a lesson ships its student stubs, so they are excluded there. A
      # solution branch loesung/lNN-<slug> must additionally have its OWN
      # label green - the other lessons' tests stay excluded, since their
      # stubs are still red on that branch. "Own" includes the lesson's
      # optional deep-dive tests (label rnlab-LNN-vertiefung, e.g. L10's
      # test_v_*): red on the stub, but the solution must pass them too.
      - name: Unit tests
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          ctest --test-dir build/host --output-on-failure -LE '^rnlab-L'
          if [[ "$BRANCH" =~ ^loesung/l([0-9][0-9])- ]]; then
            ctest --test-dir build/host --output-on-failure --no-tests=error \
              -L "^rnlab-L${BASH_REMATCH[1]}(-vertiefung)?\$"
          fi

  generated:
    name: Generated files are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The vector table is derived from the CMSIS header. If someone edits the
      # generated file by hand, or bumps the submodule without regenerating,
      # this catches it before a wrong handler lands in a live interrupt slot.
      - name: Regenerate the vector table and diff
        run: |
          python3 scripts/gen_vectors.py \
            lib/cmsis_device_f4/Include/stm32f429xx.h \
            targets/itsboard/startup/vectors_stm32f429.c
          git diff --exit-code targets/itsboard/startup/vectors_stm32f429.c

  # NOTE: there is no on-target job here. The hardware gate needs the physical
  # board and the ST-Link, which the maintainer holds exclusively, and it is
  # run with scripts/board_test.py before every merge. A green CI on its own
  # does not mean the firmware runs - the display bus is write-only and cannot
  # be verified in software at all.
